[project]
name = "stargaze"
version = "0.1.0"
description = "Photometry-only star/galaxy/quasar classifier that degrades gracefully on bad input"
readme = "README.md"
authors = [
    { name = "Kurt" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
